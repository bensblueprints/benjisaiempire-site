<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Benji's AI Empire</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:#0a0a0a; color:#fff; min-height:100vh;
      display:grid; place-items:center; padding:24px; text-align:center;
    }
    .wrap{max-width:560px}
    .code{
      font-family:'Bebas Neue','Inter',sans-serif; font-size:96px;
      color:#d4af37; line-height:1; letter-spacing:.01em;
    }
    h1{font-size:28px; margin:8px 0 12px; font-weight:700}
    p{color:#9ca3af; margin-bottom:28px}
    a{
      display:inline-block; padding:14px 22px; background:#d4af37;
      color:#0a0a0a; border-radius:8px; font-weight:600; text-decoration:none;
      transition:background .2s;
    }
    a:hover{background:#f0c850}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This door doesn't exist.</h1>
    <p>The page moved, or never existed. The Starter Kit always exists.</p>
    <a href="/">← Back to the Empire</a>
  </div>
</body>
</html>
